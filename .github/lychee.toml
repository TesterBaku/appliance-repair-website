# lychee configuration for .github/workflows/link-rot.yml (external link check).
#
# Lives under .github/ on purpose: the deploy workflow's "Prune non-public files"
# step removes .github/ from the published artifact, so this file is never served.
# A lychee.toml at the repo root would be.

# External links only. Relative and file links are test/links.js's job and it
# already runs on every PR; checking them twice would only add a second opinion
# that can disagree.
scheme = ["https", "http"]

# 403 and 429 are accepted, which means "not reported", not "verified". On the first
# run (2026-11-22, run 45059348172) 30 of 32 failures were 403s from sites that
# refuse any automated client (maytag.com, fsis.usda.gov, partselect.com and
# others). A link that is really gone answers 404, 410, a 5xx or fails to resolve,
# and those are still reported.
# Known gap: a page that starts answering 403 to every visitor is not caught.
accept = ["200..=299", "403", "429"]

# Outbound sites are slow and flaky more often than they are dead.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
max_redirects = 10

no_progress = true

# Stamped chrome sources and build output: every link in them is also present in
# the pages they are stamped into, or is not site content at all.
exclude_path = [
    "(^|/)partials/",
    "(^|/)pagefind/",
    "(^|/)node_modules/",
    "(^|/)test/",
    "(^|/)test-results/",
]

exclude = [
    # Our own domain: canonical, og:url and JSON-LD URLs on every page. Internal
    # targets are verified from the file tree by test/links.js. Checking them here
    # would hit production once per page, and on a pull request it would report
    # every not-yet-deployed page as a 404.
    '^https?://(www\.)?fixappliancesfast\.com(/|$)',

    # Infrastructure hosts, not content links: font CSS, the Google tag and the
    # contact-form endpoint (a POST-only URL; never request it).
    '^https://fonts\.googleapis\.com',
    '^https://fonts\.gstatic\.com',
    '^https://www\.googletagmanager\.com',
    '^https://formspree\.io',

    # Vocabulary identifiers inside JSON-LD, not links a reader follows.
    '^https?://schema\.org',

    # Our own profiles, linked from the footer and JSON-LD of every page, and every
    # other Google Maps link (a handful of city "place" links). These hosts answer
    # automated clients with a login wall, a consent page or a refusal, so a result
    # here says nothing about the link. Check them by hand.
    '^https://(www\.)?google\.com/maps',
    '^https://(www\.)?yelp\.com',
    '^https://(www\.)?instagram\.com',

    # fda.gov answers the checker with 404 for pages that exist. Both links the
    # first runs reported (runs 45059533770 and 45063310474) opened normally in a
    # browser and through a plain fetch on 2026-11-22. A 404 from this host is
    # therefore not evidence, so it is excluded. Check fda.gov links by hand.
    '^https://(www\.)?fda\.gov',
]

name: Deploy to GitHub Pages

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

# A newer master push supersedes the whole prior run; PRs have separate groups
# and cannot cancel production validation or deployment.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static checks
        run: npm test

      - name: Screenshot checks
        run: npm run screenshot

      - name: Functional checks
        run: npm run test:functional

  # Upload and deploy are separate jobs on purpose. deploy-pages looks the
  # artifact up through the Actions artifact service, and that lookup can come
  # back empty for an artifact finalized a moment earlier in the SAME job
  # (actions/deploy-pages issue 451). Observed here on 2026-11-20 and 2026-11-21:
  # four lookups came back with 0 within a second of the upload (first attempts
  # of runs 44801284180, 44810840166 and 44944397652, and attempt 3 of
  # 44810840166). On 44944397652 the REST artifact list already showed the new
  # artifact (so polling the REST list, tried in PR #991, proves nothing about the lookup
  # deploy-pages does). Uploading in an earlier job puts a job start between the
  # upload and the lookup, and makes "Re-run failed jobs" on a failed deploy
  # safe: it re-runs the deploy job only, with no second upload.
  package:
    name: Package site
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      actions: write   # list and delete this run's own leftover Pages artifacts
    runs-on: ubuntu-latest
    steps:
      # A fresh runner/checkout keeps validation dependencies and test outputs
      # out of the public artifact, while checking out the same event revision.
      - name: Checkout
        uses: actions/checkout@v4

      # Strip committed dev/internal files so they are not served on the public
      # Pages domain (rules, plans, logs, agent configs, build scripts, tests).
      # Runs against the throwaway CI checkout only; the repo is untouched.
      # The static site references none of these at runtime.
      - name: Prune non-public files
        run: |
          rm -rf .claude .agents .codex .hermes .impeccable \
                 tasks logs test scripts .github \
                 AGENTS.md CLAUDE.md PRODUCT.md DESIGN.md README.md

      # deploy-pages fails unless exactly one "github-pages" artifact exists on
      # the run. A full re-run ("Re-run all jobs") uploads again beside the one
      # the earlier attempt left, which then fails with "Artifact count is 2",
      # so delete what earlier attempts left before uploading.
      - name: Remove Pages artifacts left by earlier attempts of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed list must stop the step, not read as "nothing to delete":
          # try three times, then fail before anything is uploaded or deployed.
          listed=no
          for attempt in 1 2 3; do
            if ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id'); then
              listed=yes
              break
            fi
            echo "Listing artifacts failed (attempt $attempt), retrying"
            sleep 5
          done
          if [ "$listed" != "yes" ]; then
            echo "Could not list this run's artifacts after 3 attempts" >&2
            exit 1
          fi
          printf '%s\n' "$ids" | grep . | while read -r id; do
            echo "Deleting leftover artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

# A newer master push supersedes the whole prior run; PRs have separate groups
# and cannot cancel production validation or deployment.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static checks
        run: npm test

      - name: Screenshot checks
        run: npm run screenshot

      - name: Functional checks
        run: npm run test:functional

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # list and delete this run's own Pages artifacts (steps below)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # A fresh runner/checkout keeps validation dependencies and test outputs
      # out of the public artifact, while checking out the same event revision.
      - name: Checkout
        uses: actions/checkout@v4

      # Strip committed dev/internal files so they are not served on the public
      # Pages domain (rules, plans, logs, agent configs, build scripts, tests).
      # Runs against the throwaway CI checkout only; the repo is untouched.
      # The static site references none of these at runtime.
      - name: Prune non-public files
        run: |
          rm -rf .claude .agents .codex .hermes .impeccable \
                 tasks logs test scripts .github \
                 AGENTS.md CLAUDE.md PRODUCT.md DESIGN.md README.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # deploy-pages fails unless it lists exactly one "github-pages" artifact on
      # this run. Observed on 2026-11-20 (runs 44801284180 and 44810840166, seven
      # deploy attempts): with no earlier artifact it listed 0 three times, one
      # second after the upload; on re-runs, which upload a second artifact beside
      # the one the earlier attempt left, it listed 2 three times and 1 once (the
      # one success). Inferred, not proven: a fresh upload takes a variable moment
      # to appear in the list. So: delete what earlier attempts left, upload, then
      # wait until the list shows exactly one artifact and it is the new one.
      - name: Remove Pages artifacts left by earlier attempts of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/deleted-pages-artifacts.txt"
          # A failed list must stop the step, not read as "nothing to delete":
          # try three times, then fail before anything is uploaded or deployed.
          listed=no
          for attempt in 1 2 3; do
            if ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id'); then
              listed=yes
              break
            fi
            echo "Listing artifacts failed (attempt $attempt), retrying"
            sleep 5
          done
          if [ "$listed" != "yes" ]; then
            echo "Could not list this run's artifacts after 3 attempts" >&2
            exit 1
          fi
          printf '%s\n' "$ids" | grep . | while read -r id; do
            echo "Deleting leftover artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "$id" >> "$RUNNER_TEMP/deleted-pages-artifacts.txt"
          done

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wait until the uploaded artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pass only when exactly one is listed AND it is not one deleted above
          # (a deleted artifact can linger in the list for a moment too).
          for attempt in $(seq 1 60); do
            # One failed poll (a 5xx, a rate limit) must not end the wait.
            if ! ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id'); then
              echo "attempt $attempt: listing failed, retrying"
              total=unknown; fresh=unknown
              sleep 3
              continue
            fi
            total=$(printf '%s\n' "$ids" | grep -c . || true)
            fresh=$(printf '%s\n' "$ids" | grep . | grep -vxFf "$RUNNER_TEMP/deleted-pages-artifacts.txt" | grep -c . || true)
            echo "attempt $attempt: $total listed, $fresh new"
            if [ "$total" = "1" ] && [ "$fresh" = "1" ]; then exit 0; fi
            sleep 3
          done
          echo "Expected exactly 1 new github-pages artifact within 180s; last saw $total listed, $fresh new" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

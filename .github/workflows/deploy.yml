name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip committed dev/internal files so they are not served on the public
      # Pages domain (rules, plans, logs, agent configs, build scripts, tests).
      # Runs against the throwaway CI checkout only; the repo is untouched.
      # The static site references none of these at runtime.
      - name: Prune non-public files
        run: |
          rm -rf .claude .agents .codex .hermes .impeccable \
                 tasks logs test scripts .github \
                 AGENTS.md CLAUDE.md PRODUCT.md DESIGN.md README.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
